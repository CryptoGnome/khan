[package]
name = "khan"
version = "0.1.0"
edition = "2021"
description = "Autonomous AI agent company: a CEO agent that hires, delegates, self-evolves, and never stops"
license = "MIT"
repository = "https://github.com/CryptoGnome/khan"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "net", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
futures = "0.3"
chrono = "0.4"
html2text = "0.12"
